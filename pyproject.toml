[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-statcast-pipeline"
version = "0.1.0"
description = "CLI tool for fetching and managing Baseball Savant Statcast data"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "tqdm>=4.66",
    "flask>=3.0",
    "flask-login>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
]
analysis = [
    "numpy>=1.26",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "markdown>=3.5",
]

[project.scripts]
statcast = "savant.cli:cli"

[tool.setuptools.packages.find]
include = ["savant*", "webapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
