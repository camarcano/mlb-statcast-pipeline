[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-statcast-pipeline"
version = "0.1.0"
description = "CLI tool for fetching and managing Baseball Savant Statcast data"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
]

[project.scripts]
statcast = "savant.cli:cli"

[tool.setuptools.packages.find]
include = ["savant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
